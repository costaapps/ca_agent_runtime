services:
  agent-runtime:
    image: ${AGENT_RUNTIME_IMAGE:?Set AGENT_RUNTIME_IMAGE to a published AgentRuntime version or run tag}
    env_file:
      - ${AGENT_RUNTIME_ENV_FILE:-../agent-runtime.env}
    environment:
      NODE_ENV: production
      PORT: "3101"
    ports:
      - "127.0.0.1:${AGENT_RUNTIME_HOST_PORT:-3101}:3101"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 130s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
          pids: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - ai-shared

networks:
  ai-shared:
    external: true
